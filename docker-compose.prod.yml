x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official entrypoint needs these capabilities only during its
    # initialization step to prepare the data directory and switch to the
    # postgres user; all other capabilities remain dropped.
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
          memory: "${POSTGRES_MEMORY_LIMIT:-1G}"
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: flux_studio
    volumes:
      - xinyue_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux -d flux_studio"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # redis's setpriv entrypoint must be able to drop from root to redis.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-1.0}"
          memory: "${REDIS_MEMORY_LIMIT:-512M}"
    command: redis-server --appendonly yes
    volumes:
      - xinyue_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  dailyhot-redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    profiles: ["recommendations"]
    restart: unless-stopped
    init: true
    command: redis-server --save "" --appendonly no
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${DAILYHOT_REDIS_CPU_LIMIT:-1.0}"
          memory: "${DAILYHOT_REDIS_MEMORY_LIMIT:-256M}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - recommendations

  dailyhot:
    image: imsyy/dailyhot-api:v2.0.8@sha256:748fc79d29a422f512018e8a58ef1a0e20306dd6254637933960573fa37b1e5e
    profiles: ["recommendations"]
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${DAILYHOT_CPU_LIMIT:-1.0}"
          memory: "${DAILYHOT_MEMORY_LIMIT:-512M}"
    environment:
      PORT: "6688"
      ALLOWED_DOMAIN: "*"
      DISALLOW_ROBOT: "true"
      REDIS_HOST: dailyhot-redis
      REDIS_PORT: "6379"
      REDIS_DB: "2"
      CACHE_TTL: "1800"
      REQUEST_TIMEOUT: "6000"
      USE_LOG_FILE: "false"
      RSS_MODE: "false"
    depends_on:
      dailyhot-redis:
        condition: service_healthy
    networks:
      - recommendations

  image-worker:
    build:
      context: ./workers/image-tools
    profiles: ["image-tools"]
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${LOCAL_WORKER_CPU_LIMIT:-2.0}"
          memory: "${LOCAL_WORKER_MEMORY_LIMIT:-2G}"
    environment:
      WORKER_TOKEN: ${LOCAL_WORKER_TOKEN:?LOCAL_WORKER_TOKEN must be set}
      MAX_CONCURRENCY: ${LOCAL_WORKER_CONCURRENCY:-1}
      RESULT_TTL_SECONDS: ${LOCAL_WORKER_RESULT_TTL_SECONDS:-604800}
      REMBG_MODEL: ${LOCAL_WORKER_REMBG_MODEL:-u2net}
    volumes:
      - xinyue_worker_models:/home/worker/.u2net
      - xinyue_worker_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20

  iopaint-worker:
    build:
      context: ./workers/iopaint
    profiles: ["iopaint"]
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${LOCAL_WORKER_CPU_LIMIT:-2.0}"
          memory: "${LOCAL_WORKER_MEMORY_LIMIT:-2G}"
    environment:
      WORKER_TOKEN: ${LOCAL_WORKER_TOKEN:?LOCAL_WORKER_TOKEN must be set}
      MAX_CONCURRENCY: ${LOCAL_WORKER_CONCURRENCY:-1}
      RESULT_TTL_SECONDS: ${LOCAL_WORKER_RESULT_TTL_SECONDS:-604800}
      IOPAINT_MODEL: ${LOCAL_WORKER_IOPAINT_MODEL:-lama}
      DEVICE: ${LOCAL_WORKER_IOPAINT_DEVICE:-cpu}
    volumes:
      - xinyue_iopaint_models:/models
      - xinyue_iopaint_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20

  realesrgan-worker:
    build:
      context: ./workers/realesrgan
    profiles: ["realesrgan"]
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${LOCAL_WORKER_CPU_LIMIT:-2.0}"
          memory: "${LOCAL_WORKER_MEMORY_LIMIT:-2G}"
    environment:
      WORKER_TOKEN: ${LOCAL_WORKER_TOKEN:?LOCAL_WORKER_TOKEN must be set}
      MAX_CONCURRENCY: ${LOCAL_WORKER_CONCURRENCY:-1}
      RESULT_TTL_SECONDS: ${LOCAL_WORKER_RESULT_TTL_SECONDS:-604800}
      DEVICE: ${LOCAL_WORKER_REALESRGAN_DEVICE:-cpu}
      REALESRGAN_TILE: ${LOCAL_WORKER_REALESRGAN_TILE:-0}
    volumes:
      - xinyue_realesrgan_models:/models
      - xinyue_realesrgan_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20

  comfyui-gateway:
    build:
      context: ./workers/comfyui-gateway
    profiles: ["comfyui"]
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${LOCAL_WORKER_CPU_LIMIT:-2.0}"
          memory: "${LOCAL_WORKER_MEMORY_LIMIT:-2G}"
    environment:
      WORKER_TOKEN: ${LOCAL_WORKER_TOKEN:?LOCAL_WORKER_TOKEN must be set}
      MAX_CONCURRENCY: ${LOCAL_WORKER_CONCURRENCY:-1}
      RESULT_TTL_SECONDS: ${LOCAL_WORKER_RESULT_TTL_SECONDS:-604800}
      COMFYUI_URL: ${COMFYUI_URL:-http://comfyui:8188}
      COMFYUI_TIMEOUT_SECONDS: ${COMFYUI_TIMEOUT_SECONDS:-600}
    volumes:
      - ${COMFYUI_WORKFLOW_DIR:-./workers/comfyui-gateway/workflows}:/workflows:ro
      - xinyue_comfyui_gateway_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20

  uploads-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    logging: *default-logging
    command: ["sh", "-c", "mkdir -p /uploads && chown 1000:1000 /uploads && chmod 770 /uploads"]
    volumes:
      - xinyue_uploads:/uploads

  backend:
    build:
      context: ./server
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-2.0}"
          memory: "${BACKEND_MEMORY_LIMIT:-1G}"
    env_file:
      - .env.production
    volumes:
      - xinyue_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    networks:
      - default
      - recommendations
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-1.0}"
          memory: "${FRONTEND_MEMORY_LIMIT:-256M}"
    ports:
      # The frontend is the only host-facing service. Default to direct IP
      # access; advanced deployments can set XINYUE_HTTP_BIND=127.0.0.1 and
      # place a TLS reverse proxy in front of the selected host port.
      - "${XINYUE_HTTP_BIND:-0.0.0.0}:${XINYUE_HTTP_PORT:-6001}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      # Verify the public reverse-proxy path, not only the static SPA shell.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  xinyue_postgres:
  xinyue_redis:
  xinyue_uploads:
  xinyue_worker_models:
  xinyue_worker_data:
  xinyue_iopaint_models:
  xinyue_iopaint_data:
  xinyue_realesrgan_models:
  xinyue_realesrgan_data:
  xinyue_comfyui_gateway_data:

networks:
  recommendations:
