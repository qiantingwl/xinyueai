<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Xinyue AI 是一个面向对话、图片生成和商品上新的 AI 创作工作台。"
    />
    <meta name="theme-color" content="#0b0c10" />
    <script>
      // 首屏前解析主题，避免「跟随系统」时闪烁。与 src/App.vue 的解析逻辑保持一致。
      (function () {
        try {
          var appearance = ''
          try { appearance = (JSON.parse(localStorage.getItem('xinyue:settings') || '{}') || {}).appearance || '' } catch (e) {}
          var theme = (appearance === '浅色' || appearance === 'light') ? 'light'
            : (appearance === '深色' || appearance === 'dark') ? 'dark'
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.dataset.studioTheme = theme
        } catch (e) { document.documentElement.dataset.studioTheme = 'dark' }
      })()
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23111214'/%3E%3Cpath d='M8 7h6l2 5 2-5h6l-5 9 5 9h-6l-2-5-2 5H8l5-9z' fill='white'/%3E%3C/svg%3E" />
    <title>Xinyue AI</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
