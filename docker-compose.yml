services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux_dev_password
      POSTGRES_DB: flux_studio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flux_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux -d flux_studio"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - flux_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  flux_postgres:
  flux_redis:
